ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/scripts>
    Require all denied
</Directory>

<Directory /var/www/html/includes>
    Require all denied
</Directory>

<Directory /var/www/html/storage>
    Require all denied
</Directory>

<Directory /var/www/html/tests>
    <FilesMatch "\.(php|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

DirectoryIndex index.php index.html
